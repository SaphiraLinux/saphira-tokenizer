<text x="188" y="185" text-anchor="middle" font-size="11">880</text>
<text x="146" y="318" text-anchor="middle" font-size="12">OWT-20M</text>
<rect x="318" y="210" width="84" height="90" fill="#2b7bbb"/>
<text x="360" y="206" text-anchor="middle" font-size="11">714</text>
<rect x="404" y="86" width="84" height="214" fill="#3aa655"/>
<text x="446" y="82" text-anchor="middle" font-size="11">1701</text>
